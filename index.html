<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>chipme</title>
  <meta name="description" content="A tiny poker buy-in counter and settle-up ledger." />
  <meta name="theme-color" content="#0f3d2e" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23e5484d'/><circle cx='50' cy='50' r='30' fill='none' stroke='white' stroke-width='8' stroke-dasharray='12 10'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" aria-label="chipme home">
      <span class="brand-chip" aria-hidden="true"></span>chipme
    </button>
    <nav class="steps" id="steps" aria-label="Game stage">
      <span data-step="setup">Setup</span>
      <span data-step="table">Table</span>
      <span data-step="settle">Cash out</span>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <div id="fx" class="fx" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="modal" class="modal"></dialog>

  <script src="app.js"></script>
</body>
</html>
